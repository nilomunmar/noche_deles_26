<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin – Actividades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; font-weight: 500; color: #111; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 1.8rem; }
    .list { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .name { font-size: 0.95rem; color: #222; flex: 1; }
    .pill { font-size: 0.78rem; padding: 3px 12px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
    .pill-free { background: #e8f5e9; color: #2e7d32; }
    .pill-busy { background: #ffebee; color: #c62828; }
    .btn { font-size: 0.82rem; padding: 5px 14px; border-radius: 8px; border: 1px solid #d0d0cc; background: transparent; cursor: pointer; white-space: nowrap; }
    .btn-occupy { border-color: #ef9a9a; color: #c62828; }
    .btn-occupy:hover { background: #ffebee; }
    .btn-free { border-color: #a5d6a7; color: #2e7d32; }
    .btn-free:hover { background: #e8f5e9; }
    .btn-reset { margin-top: 1.5rem; font-size: 0.8rem; padding: 6px 16px; border-radius: 8px; border: 1px solid #d0d0cc; background: transparent; cursor: pointer; color: #999; }
    .btn-reset:hover { background: #f0f0ee; color: #555; }
  </style>
</head>
<body>
  <h1>Panel de administración</h1>
  <p class="subtitle">Los cambios se reflejan al instante en todos los dispositivos</p>
  <div class="list" id="list"></div>
  <button class="btn-reset" id="btn-reset">Restablecer todo a libre</button>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, onValue, update, set }
      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyD69PyemhsShvCdk__Db6SLVqOjVVPAurE",
        authDomain: "enef-valencia-2026-noche-deles.firebaseapp.com",
        databaseURL: "https://enef-valencia-2026-noche-deles-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "enef-valencia-2026-noche-deles",
        storageBucket: "enef-valencia-2026-noche-deles.firebasestorage.app",
        messagingSenderId: "613413956461",
        appId: "1:613413956461:web:f6c5d1f8695e785dce0864",
        measurementId: "G-V1FVSB1T39"
    };

    // ✏️ EDITA AQUÍ TUS ACTIVIDADES (mismo orden que en usuario.html)
    const ACTIVIDADES = [
      'Actividad 1',
      'Actividad 2',
      'Actividad 3',
      'Actividad 4',
      'Actividad 5',
    ];

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const estadosRef = ref(db, 'estados');

    let estados = {};

    onValue(estadosRef, snapshot => {
      estados = snapshot.val() || {};
      renderList();
    });

    function renderList() {
      document.getElementById('list').innerHTML = ACTIVIDADES.map((nombre, i) => {
        const libre = estados[i] !== false;
        return `
          <div class="card" data-index="${i}">
            <span class="name">${nombre}</span>
            <span class="pill ${libre ? 'pill-free' : 'pill-busy'}">
              ${libre ? 'Libre' : 'Ocupada'}
            </span>
            <button class="btn ${libre ? 'btn-occupy' : 'btn-free'}" data-action="toggle">
              ${libre ? 'Marcar ocupada' : 'Marcar libre'}
            </button>
          </div>
        `;
      }).join('');
    }

    document.getElementById('list').addEventListener('click', e => {
      const card = e.target.closest('.card');
      if (!card || e.target.dataset.action !== 'toggle') return;
      const i = card.dataset.index;
      const libreActual = estados[i] !== false;
      update(estadosRef, { [i]: !libreActual });
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      const reset = {};
      ACTIVIDADES.forEach((_, i) => reset[i] = true);
      set(estadosRef, reset);
    });
  </script>
</body>
</html>
