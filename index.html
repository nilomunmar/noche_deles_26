<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actividades</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; font-weight: 500; color: #111; margin-bottom: 0.3rem; }
    .subtitle { font-size: 0.85rem; color: #888; margin-bottom: 1.8rem; }
    .list { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }
    .card { background: #fff; border: 1px solid #e5e5e3; border-radius: 12px; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
    .name { font-size: 0.95rem; color: #222; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-free { background: #4caf50; }
    .dot-busy { background: #ef5350; }
    .pill { font-size: 0.78rem; padding: 3px 12px; border-radius: 20px; font-weight: 500; }
    .pill-free { background: #e8f5e9; color: #2e7d32; }
    .pill-busy { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <h1>Noche de Deles - ENEF Valencia 2026</h1>
  <p class="subtitle">Estado actualizado en tiempo real</p>
  <div class="list" id="list"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

    const firebaseConfig = {
        apiKey: "AIzaSyD69PyemhsShvCdk__Db6SLVqOjVVPAurE",
        authDomain: "enef-valencia-2026-noche-deles.firebaseapp.com",
        databaseURL: "https://enef-valencia-2026-noche-deles-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "enef-valencia-2026-noche-deles",
        storageBucket: "enef-valencia-2026-noche-deles.firebasestorage.app",
        messagingSenderId: "613413956461",
        appId: "1:613413956461:web:f6c5d1f8695e785dce0864",
        measurementId: "G-V1FVSB1T39"
    };

    // ✏️ EDITA AQUÍ TUS ACTIVIDADES (solo los nombres)
    const ACTIVIDADES = [
      'Actividad 1',
      'Actividad 2',
      'Actividad 3',
      'Actividad 4',
      'Actividad 5',
    ];

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'estados'), snapshot => {
      const estados = snapshot.val() || {};
      const list = document.getElementById('list');
      list.innerHTML = ACTIVIDADES.map((nombre, i) => {
        const libre = estados[i] !== false;
        return `
          <div class="card">
            <span class="name">
              <span class="dot ${libre ? 'dot-free' : 'dot-busy'}"></span>
              ${nombre}
            </span>
            <span class="pill ${libre ? 'pill-free' : 'pill-busy'}">
              ${libre ? 'Libre' : 'Ocupada'}
            </span>
          </div>
        `;
      }).join('');
    });
  </script>
</body>
</html>
